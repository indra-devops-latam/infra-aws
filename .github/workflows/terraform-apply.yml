name: "Terraform - Apply Infrastructure"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "*.tf"
      - "*.hcl"
      - "env/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: us-east-1

jobs:
  apply:
    name: "Apply (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    strategy:
      matrix:
        include:
          - branch: develop
            env_file: env/dev.tfvars
            workspace: dev
          - branch: main
            env_file: env/prod.tfvars
            workspace: prod

    if: github.base_ref == 'develop' || github.base_ref == 'main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsTerraformRole
          aws-region: ${{env.AWS_REGION}}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend-${{ matrix.workspace }}.hcl

      - name: Terraform Apply
        run: terraform apply -var-file="${{ matrix.env_file }}" -auto-approve