name: "Terraform - Apply Infrastructure"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "*.tf"
      - "*.hcl"
      - "env/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply-dev:
    name: "Apply DEV"
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/apply.yml
    with:
      environment: dev
    secrets: inherit

  apply-prod:
    name: "Apply PROD"
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/apply.yml
    with:
      environment: prod
    secrets: inherit