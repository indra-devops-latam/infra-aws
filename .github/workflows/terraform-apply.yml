name: "Terraform - Apply Infrastructure"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "*.tf"
      - "*.hcl"
      - "env/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: us-east-1

jobs:
  apply-dev:
    name: "Apply DEV"
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/apply.yml
    with:
      environment: dev

  apply-prod:
    name: "Apply PROD"
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/apply.yml
    with:
      environment: prod