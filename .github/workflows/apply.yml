name: "Terraform - Apply Reusable"

on:
  workflow_call:
    inputs:
      environment:
        description: "Terraform environment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  terraform_version: ${{ vars.TERRAFORM_VERSION }}
  aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_kms_key_administrators: ${{ vars.KMS_KEY_ADMINISTRATORS }}

jobs:
  apply-dev:
    name: "Apply ${{inputs.environment}}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.aws_region}}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.terraform_version}}

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend-${{inputs.environment}}.hcl

      - name: Terraform Apply
        run: terraform apply -var-file="env/${{inputs.environment}}.tfvars" -auto-approve